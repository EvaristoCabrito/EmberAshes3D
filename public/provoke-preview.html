<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Provoke · Effect preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#110f0d;color:#e7d4bc;font:16px system-ui}main{max-width:1000px;margin:40px auto;padding:24px}header{display:flex;gap:24px;align-items:center}img{width:92px;height:112px;object-fit:cover;border:1px solid #79604c;border-radius:10px}h1{margin:0 0 8px;font:36px Georgia}p{color:#b6a38e;line-height:1.6}canvas{width:100%;height:auto;display:block;background:#181b19;border:1px solid #423e33;border-radius:12px;margin:24px 0}button{background:#34281f;color:#efd6b6;border:1px solid #876144;border-radius:6px;padding:10px 18px;cursor:pointer;margin-right:8px}output{color:#b8a38a;margin-left:10px}
</style>
<main><header><img src="/game/icons/provoke.jpg" alt="Provoke iron skull icon"><div><h1>Provoke</h1><p>A sharp red-orange energy flare, glowing strands, and rising sparks on each affected enemy.</p></div></header>
<canvas width="960" height="480" aria-label="Provoke WebGL effect preview on an irregular hex battlefield"></canvas>
<button id="replay">Replay</button><button id="pause">Pause</button><button id="group">Three targets</button><output>2D WebGL · 1.15 seconds</output>
<p>Provoke uses the same 2D WebGL glow and energy strokes in combat. The supplied image is the spell icon.</p></main>
<script type="module">
import {WebGL2DRenderer} from '/src/game/gfx/WebGL2DRenderer.ts';
import {drawProvokeVFX, PROVOKE_FX_DURATION} from '/src/game/gfx/ProvokeVFX.ts';
const canvas=document.querySelector('canvas'),ctx=new WebGL2DRenderer(canvas);
let origin=performance.now(),paused=false,held=0,group=false;
const hex=(x,y,s)=>{ctx.beginPath();for(let i=0;i<6;i++){let a=Math.PI/3*i-Math.PI/6;let px=x+Math.cos(a)*s,py=y+Math.sin(a)*s;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()};
function frame(now){
const t=paused?held:((now-origin)/1000)%2.25;window.__provokePreview={time:t,group,paused,webgl:!!ctx.gl};ctx.clear();
const cells=[];
for(let r=-2;r<=2;r++)for(let q=-4;q<=4;q++){if(Math.abs(q+r)>4||q===-4&&r<0||q===4&&r>0||q===3&&r===-2)continue;const x=480+(q+r/2)*83,y=265+r*72;cells.push([x,y]);hex(x,y,47);ctx.fillStyle=(q+r)%3?'#262c25':'#2e342a';ctx.fill();ctx.strokeStyle='#454a3b';ctx.lineWidth=1;ctx.stroke()}
const targets=group?[[480,265],[563,265],[521.5,193]]:[[480,265]];
for(const [x,y]of [[272.5,337],...targets]){hex(x,y,17);ctx.fillStyle=x===272.5?'#758f9b':'#9c6d52';ctx.fill();ctx.fillStyle='#d7c5a9';ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillText(x===272.5?'Warrior':'Enemy',x,y+33)}
for(const[x,y]of targets)drawProvokeVFX(ctx,x,y-8,54,t);
requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.querySelector('#replay').onclick=()=>{origin=performance.now();held=0;paused=false;document.querySelector('#pause').textContent='Pause'};
document.querySelector('#pause').onclick=()=>{if(paused){origin=performance.now()-held*1000;paused=false}else{held=((performance.now()-origin)/1000)%2.25;paused=true}document.querySelector('#pause').textContent=paused?'Resume':'Pause'};
document.querySelector('#group').onclick=()=>{group=!group;document.querySelector('#group').textContent=group?'One target':'Three targets';origin=performance.now()};
</script></html>
